<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Bus Stop - Night Scene</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #080a10;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080a10);

  const camera = new THREE.PerspectiveCamera(
    40,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2 - 0.01;
  controls.minDistance = 2;
  controls.maxDistance = 25;

  const ambientLight = new THREE.AmbientLight(0x23334d, 0.2);
  scene.add(ambientLight);

  const nightFrontLight = new THREE.DirectionalLight(0x9fc3ea, 0.5);
  nightFrontLight.castShadow = true;
  nightFrontLight.shadow.mapSize.width = 2048;
  nightFrontLight.shadow.mapSize.height = 2048;
  nightFrontLight.shadow.bias = -0.0004;
  nightFrontLight.shadow.normalBias = 0.04;
  nightFrontLight.shadow.radius = 3;
  scene.add(nightFrontLight);
  scene.add(nightFrontLight.target);

  const frontFillLight = new THREE.DirectionalLight(0x4a6585, 0.2);
  scene.add(frontFillLight);

  const BASE_SPOT_INTENSITY = 4.5;
  const BASE_BOUNCE_INTENSITY = 1.8;

  const roofSpot = new THREE.SpotLight(0xff9433, BASE_SPOT_INTENSITY);
  roofSpot.angle = Math.PI / 2.5;
  roofSpot.penumbra = 0.9;
  roofSpot.decay = 2;
  roofSpot.distance = 10;
  roofSpot.castShadow = true;
  roofSpot.shadow.bias = -0.0005;
  roofSpot.shadow.mapSize.width = 1024;
  roofSpot.shadow.mapSize.height = 1024;
  roofSpot.shadow.radius = 2.5;
  scene.add(roofSpot);
  scene.add(roofSpot.target);

  const warmBounce = new THREE.PointLight(0xff8020, BASE_BOUNCE_INTENSITY, 6, 2);
  scene.add(warmBounce);

  const groundGeo = new THREE.PlaneGeometry(80, 80);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x0e1117,
    roughness: 0.7,
    metalness: 0.1
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0;
  ground.receiveShadow = true;
  scene.add(ground);

  const loader = new THREE.GLTFLoader();
  const modelUrl = 'https://raw.githubusercontent.com/BlackBerry8973/BlackBerry8973.github.io/main/3DModels/3D.glb';

  loader.load(modelUrl, (gltf) => {
    const model = gltf.scene;

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    model.position.set(-center.x, -box.min.y, -center.z);

    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        if (child.material) {
          child.material.shadowSide = THREE.DoubleSide;
        }
      }
    });

    scene.add(model);

    const width = Math.max(size.x, size.z);
    const depth = Math.min(size.x, size.z);

    nightFrontLight.position.set(-width * 1.2, size.y * 2.2, width * 0.7);
    nightFrontLight.target.position.set(depth * 1.5, 0, -width * 0.2);

    frontFillLight.position.set(-width * 1.0, size.y * 1.2, -width * 0.6);

    const shadowD = width * 1.3;
    nightFrontLight.shadow.camera.left = -shadowD;
    nightFrontLight.shadow.camera.right = shadowD;
    nightFrontLight.shadow.camera.top = shadowD;
    nightFrontLight.shadow.camera.bottom = -shadowD;
    nightFrontLight.shadow.camera.near = 1;
    nightFrontLight.shadow.camera.far = 40;
    nightFrontLight.shadow.camera.updateProjectionMatrix();

    roofSpot.position.set(-depth * 0.1, size.y * 0.9, 0);
    roofSpot.target.position.set(depth * 0.4, size.y * 0.4, 0);
    warmBounce.position.set(0, size.y * 0.75, 0);

    camera.position.set(-width * 1.15, size.y * 0.85, width * 0.95);
    controls.target.set(0, size.y * 0.45, 0);
    controls.update();
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  });

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();

    let flicker = 1.0 + Math.sin(time * 45) * 0.04 + Math.sin(time * 23) * 0.06;

    if (Math.random() > 0.93) {
      flicker = Math.random() < 0.25 ? 0.05 : 0.35 + Math.random() * 0.3;
    }

    roofSpot.intensity = BASE_SPOT_INTENSITY * flicker;
    warmBounce.intensity = BASE_BOUNCE_INTENSITY * flicker;

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
